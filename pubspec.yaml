name: template_app
description: Template mobile application.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # Use as default SVG image loader, prefer use SVG as image asset
  flutter_svg: ^2.3.0

  # Functional programming thingies
  dartz: ^0.10.1

  # Use as Network Client
  dio: ^5.11.1

  # Use hive to save local data
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0

  # Use for Dependencies Injection
  get_it: ^9.3.0

  # Use for State Management with BLoC pattern
  flutter_bloc: ^9.1.1


  # Use for custom toast with Status, ex:Loading,Success,Failed
  oktoast: ^3.4.0

  # Use for responsive UI, set default size base on Mock Up
  flutter_screenutil: ^5.9.3

  cached_network_image: ^3.4.1

  # logger
  logger: ^2.8.0

  # Firebase
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0

  # router
  go_router: ^17.5.0

  # Freezed
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  flutter_native_splash: ^2.4.8

  intl: ^0.20.3

  # Use for skeleton loading placeholders
  skeletonizer: ^3.0.0

  material_ui: 1.2.0
  cupertino_ui: 1.0.2
  flutter_secure_storage: ^11.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  lint: ^2.14.0
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  http_mock_adapter: ^0.6.1

  # Pinned until Freezed supports Analyzer 13.
  mockito: 5.6.4

  # Freezed
  freezed: ^3.2.5
  json_serializable: ^6.14.1

  # Pinned until freezed support latest hive_ce_generator
  hive_ce_generator: 1.11.1

  path_provider_platform_interface: ^2.1.3
  mocktail: ^1.0.5
dependency_overrides:
#  intl: ^0.20.2
#  meta: ^1.18.3


flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700

